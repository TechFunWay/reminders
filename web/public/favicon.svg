<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset=".5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ddd6fe"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".4"/>
      <stop offset=".55" stop-color="#fff" stop-opacity=".07"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="tile">
      <rect x="0" y="0" width="512" height="512" rx="115"/>
    </clipPath>
    <filter id="gs" x="-12%" y="-8%" width="124%" height="128%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#312e81" flood-opacity=".4"/>
    </filter>
  </defs>

  <!-- Tile fills the canvas; area outside the squircle stays transparent -->
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#bg)"/>

  <!-- Depth: bottom vignette + top-left ambient -->
  <g clip-path="url(#tile)">
    <ellipse cx="256" cy="560" rx="380" ry="230" fill="#312e81" opacity=".22"/>
    <ellipse cx="140" cy="70" rx="260" ry="200" fill="#a5b4fc" opacity=".14"/>
  </g>

  <!-- S glyph: 3D extrusion side -->
  <path d="M338 160C338 114 302 94 256 94 204 94 174 124 174 168 174 220 220 242 256 256 292 270 338 292 338 344 338 388 308 418 256 418 210 418 174 398 174 352"
        fill="none" stroke="url(#side)" stroke-width="60" stroke-linecap="round"
        transform="translate(0 12)"/>

  <!-- S glyph: face -->
  <path d="M338 160C338 114 302 94 256 94 204 94 174 124 174 168 174 220 220 242 256 256 292 270 338 292 338 344 338 388 308 418 256 418 210 418 174 398 174 352"
        fill="none" stroke="url(#face)" stroke-width="60" stroke-linecap="round"
        filter="url(#gs)"/>

  <!-- Glass highlight -->
  <g clip-path="url(#tile)">
    <ellipse cx="256" cy="40" rx="360" ry="210" fill="url(#glass)"/>
  </g>

  <!-- Edge highlight -->
  <rect x="1.5" y="1.5" width="509" height="509" rx="113.5" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="2"/>
</svg>
